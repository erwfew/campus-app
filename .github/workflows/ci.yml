name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd server && npm ci
      - name: Unit tests
        run: cd server && npm test
      - name: Start server smoke test
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: production
          PORT: 3000
        run: |
          cd server
          node app.js &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:3000/api/health || (echo "Health check failed" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID
          echo "Server started and health check passed"
